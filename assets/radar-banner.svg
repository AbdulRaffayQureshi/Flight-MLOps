      <animateTransform attributeName="transform" type="rotate" from="0 170 130" to="360 170 130" dur="4s" repeatCount="indefinite"/>
    </g>

    <circle cx="170" cy="130" r="100" fill="none" stroke="#6FFFB0" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- traffic blips -->
    <circle cx="205" cy="95"  r="3" fill="#4FD8EA">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="160" r="3" fill="#4FD8EA">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="175" r="3" fill="#4FD8EA">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="90" r="4" fill="#FFB020">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

