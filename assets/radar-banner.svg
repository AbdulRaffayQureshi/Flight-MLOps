<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sweepGrad" cx="170" cy="130" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FFFB0" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#6FFFB0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6FFFB0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="100%" stop-color="#0a141c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#6FFFB0" stroke-opacity="0.12"/>

  <!-- radar scope -->
  <g>
    <circle cx="170" cy="130" r="100" fill="none" stroke="#6FFFB0" stroke-opacity="0.15"/>
    <circle cx="170" cy="130" r="72"  fill="none" stroke="#6FFFB0" stroke-opacity="0.12"/>
    <circle cx="170" cy="130" r="44"  fill="none" stroke="#6FFFB0" stroke-opacity="0.10"/>
