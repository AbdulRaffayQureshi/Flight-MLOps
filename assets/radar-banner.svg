    <line x1="170" y1="30"  x2="170" y2="230" stroke="#6FFFB0" stroke-opacity="0.08"/>
    <line x1="99"  y1="59"  x2="241" y2="201" stroke="#6FFFB0" stroke-opacity="0.06"/>
    <line x1="99"  y1="201" x2="241" y2="59"  stroke="#6FFFB0" stroke-opacity="0.06"/>

    <!-- rotating sweep -->
    <g>
